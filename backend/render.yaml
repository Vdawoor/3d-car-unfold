services:
  - type: web
    name: car-unfold-3d-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: LLM_ENDPOINT
        sync: false
      - key: API_KEY
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
